# Triển khai production trên 1 máy: Caddy (cổng 80/443) → web (Next.js, không mở cổng ra ngoài) + db (PostgreSQL).
# Vận hành bằng deploy/deploy.sh và deploy/rollback.sh — xem DEPLOY.md.
name: tnth

services:
  web:
    image: tnth-web:current
    build: .
    restart: unless-stopped
    env_file:
      - path: .env.production
        required: false
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache:uid=1000,gid=1000
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    networks: [internal]

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    environment:
      # Tên miền chính (không kèm www), đặt trong .env. Xem deploy/Caddyfile.
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 256m
    networks: [internal]

  # PostgreSQL: chỉ nghe ở 127.0.0.1 của máy chủ (truy cập từ xa qua SSH tunnel) và mạng internal.
  # KHÔNG đổi "127.0.0.1:" thành cổng công khai — Docker mở cổng xuyên qua ufw.
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - secrets/db.env
    environment:
      TZ: Asia/Ho_Chi_Minh
    command: ["postgres", "-c", "password_encryption=scram-sha-256", "-c", "log_connections=on", "-c", "log_min_duration_statement=2000"]
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    shm_size: 256m
    mem_limit: 1500m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -q"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks: [internal]

networks:
  internal:

volumes:
  db_data:
  caddy_data:
  caddy_config:
